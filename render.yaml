runtime: python-3.12
build:
  commands:
    - pip install -r requirements.txt
    - python manage.py migrate --noinput
    - python manage.py collectstatic --noinput
    - python create_admin.py

services:
  - type: web
    name: hoovale
    runtime: python
    startCommand: python manage.py migrate --noinput && gunicorn hoovale.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DATABASE_URL
        fromDatabase:
          name: hoovale_db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,www.hoovale.com,hoovale.com"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "admin@hoovale.com"
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hoovale_db
    databaseName: hoovale_db
    user: hoovale_user
    plan: free
