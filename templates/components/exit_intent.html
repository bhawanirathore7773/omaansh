<style>
.hv-exit-popup-overlay{position:fixed;inset:0;background:rgba(10,10,10,.85);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;animation:hv-fade-in .3s ease}.hv-exit-popup-overlay.active{display:flex}.hv-exit-popup{background:#fff;max-width:500px;width:100%;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 25px 70px rgba(0,0,0,.28);animation:hv-slide-up .4s ease}.hv-exit-popup-header{background:linear-gradient(135deg,#111820 0%,#27313b 100%);color:#fff;padding:30px;text-align:center;position:relative}.hv-exit-popup-header:before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#c56a2d,transparent)}.hv-exit-popup-close{position:absolute!important;top:12px!important;right:12px!important;z-index:20!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important;font-family:Arial,sans-serif!important;font-size:28px!important;font-weight:300!important;line-height:1!important;cursor:pointer;width:40px!important;height:40px!important;padding:0!important;border-radius:50%!important;transition:background .2s ease,transform .2s ease}.hv-exit-popup-close:hover,.hv-exit-popup-close:focus-visible{background:rgba(255,255,255,.18)!important;transform:scale(1.04);outline:none}.hv-exit-popup-header h3{color:#fff!important}.hv-exit-popup-header h3 span{color:#f1b57d!important;background:none!important;-webkit-text-fill-color:#f1b57d!important}.hv-exit-popup-subtitle{color:rgba(255,255,255,.82)!important;opacity:1!important;font-size:.95rem!important;line-height:1.55!important;margin:0!important}@media(max-width:600px){.hv-exit-popup-overlay{padding:12px!important}.hv-exit-popup{width:min(100%,520px)!important;max-height:calc(100dvh - 24px)!important;overflow-y:auto!important;border-radius:22px!important}.hv-exit-popup-header{padding:58px 22px 24px!important}.hv-exit-popup-header h3{font-size:clamp(1.65rem,7vw,2.15rem)!important;line-height:1.12!important;margin-bottom:12px!important}.hv-exit-popup-subtitle{font-size:1rem!important;line-height:1.5!important;max-width:360px;margin-inline:auto!important}.hv-exit-popup>div:not(.hv-exit-popup-header){padding:22px!important}.hv-exit-popup-close{top:12px!important;right:12px!important;width:42px!important;height:42px!important;font-size:30px!important}}@keyframes hv-fade-in{from{opacity:0}to{opacity:1}}@keyframes hv-slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
{% load seo_tags %}



<div class="hv-exit-popup-overlay" id="hvExitPopup">
    <div class="hv-exit-popup">
        <button type="button" class="hv-exit-popup-close" onclick="hvHideExitPopup()" aria-label="Close catalogue popup">
            <span aria-hidden="true">&times;</span>
        </button>

        <div class="hv-exit-popup-header">
            <div style="display:inline-block; background:rgba(201,169,97,0.15); color:#C9A961; padding:6px 14px; border-radius:30px; font-size:0.7rem; font-weight:700; letter-spacing:2px; margin-bottom:14px; border:1px solid rgba(201,169,97,0.4);">
                <i class="fas fa-gift"></i> WAIT! BEFORE YOU GO
            </div>
            <h3 style="font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:800; color:white; margin:0 0 8px; line-height:1.2;">
                Get Our <span style="background:linear-gradient(135deg,#C9A961,#D4B97A); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Wholesale Catalogue</span>
            </h3>
            <p class="hv-exit-popup-subtitle">Free PDF with 500+ designs &amp; bulk pricing slabs.</p>
        </div>

        <div style="padding:30px;">
            <form id="hvExitForm" method="POST" action="{% url 'submit_enquiry' %}">
                {% csrf_token %}
                <input type="hidden" name="message" value="Catalogue download request via exit intent popup">
                <input type="hidden" name="city" value="Catalogue Request">

                <div style="display:flex; flex-direction:column; gap:12px;">
                    <input type="text" name="name" required placeholder="Your name" class="form-control"
                           style="padding:14px; border:1.5px solid #e0e0e0; border-radius:6px; font-size:0.95rem;">
                    <input type="email" name="email" required placeholder="Your email" class="form-control"
                           style="padding:14px; border:1.5px solid #e0e0e0; border-radius:6px; font-size:0.95rem;">
                    <input type="tel" name="phone" required placeholder="WhatsApp number" class="form-control"
                           style="padding:14px; border:1.5px solid #e0e0e0; border-radius:6px; font-size:0.95rem;">

                    <button type="submit" style="background:#0a0a0a; color:white; border:none; padding:15px; border-radius:6px; font-weight:800; font-size:0.9rem; text-transform:uppercase; letter-spacing:1.5px; cursor:pointer; transition:all 0.2s;"
                            onmouseover="this.style.background='#C9A961'; this.style.color='#0a0a0a';"
                            onmouseout="this.style.background='#0a0a0a'; this.style.color='white';">
                        <i class="fas fa-download"></i> Send Me the Catalogue
                    </button>
                </div>
            </form>

            <div id="hvExitResponse"></div>

            <div style="text-align:center; margin-top:18px; padding-top:18px; border-top:1px solid #f0f0f0;">
                <p style="font-size:0.85rem; color:#6b6b6b; margin:0 0 10px;">Or chat directly:</p>
                <a href="{% whatsapp_link 'Hi, please share your wall clock catalogue.' %}" target="_blank"
                   style="color:#25D366; font-weight:700; text-decoration:none; font-size:0.95rem;">
                    <i class="fab fa-whatsapp"></i> Get on WhatsApp Instantly
                </a>
            </div>

            <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:20px; padding-top:18px; border-top:1px solid #f0f0f0; font-size:0.75rem; color:#6b6b6b;">
                <span><i class="fas fa-lock" style="color:#10b981;"></i> Your data is safe</span>
                <span><i class="fas fa-clock" style="color:#C9A961;"></i> 2 hour response</span>
                <span><i class="fas fa-shield-alt" style="color:#0a0a0a;"></i> No spam</span>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const popup = document.getElementById('hvExitPopup');
    if (!popup) return;

    const STORAGE_KEY = 'hv_exit_shown';
    const SESSION_KEY = 'hv_exit_session';
    let triggered = false;

    // Don't show if already shown in last 7 days
    const lastShown = localStorage.getItem(STORAGE_KEY);
    if (lastShown && (Date.now() - parseInt(lastShown)) < 7 * 24 * 60 * 60 * 1000) {
        return;
    }

    // Don't show twice in same session
    if (sessionStorage.getItem(SESSION_KEY)) return;

    function showPopup() {
        if (triggered) return;
        triggered = true;
        popup.classList.add('active');
        sessionStorage.setItem(SESSION_KEY, '1');
        localStorage.setItem(STORAGE_KEY, Date.now().toString());
        document.body.style.overflow = 'hidden';
    }

    window.hvHideExitPopup = function() {
        popup.classList.remove('active');
        document.body.style.overflow = '';
    };

    // Click overlay to close
    popup.addEventListener('click', function(e) {
        if (e.target === popup) hvHideExitPopup();
    });

    // Desktop: detect mouse leaving viewport top
    if (window.innerWidth > 768) {
        document.addEventListener('mouseleave', function(e) {
            if (e.clientY <= 0) showPopup();
        });
    } else {
        // Mobile: show once after 60 seconds on the first eligible visit.
        // Do not trigger from scroll gestures; this avoids interrupting reading
        // and keeps the popup timing predictable on Android/iOS.
        setTimeout(showPopup, 60000);
    }

    // ESC key to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && popup.classList.contains('active')) {
            hvHideExitPopup();
        }
    });

    // Form submission
    const form = document.getElementById('hvExitForm');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const responseDiv = document.getElementById('hvExitResponse');
        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
            const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
            const data = await response.json();
            if (data.success) {
                responseDiv.innerHTML = '<div style="background:#d4edda; color:#155724; padding:14px; border-radius:6px; margin-top:14px; font-size:0.9rem;"><i class="fas fa-check-circle"></i> Thanks! We\'ll WhatsApp you the catalogue in 2 hours.</div>';
                form.reset();
                setTimeout(hvHideExitPopup, 4000);
            } else {
                responseDiv.innerHTML = '<div style="background:#f8d7da; color:#721c24; padding:14px; border-radius:6px; margin-top:14px; font-size:0.9rem;"><i class="fas fa-exclamation-circle"></i> ' + (data.error || 'Try again or use WhatsApp.') + '</div>';
            }
        } catch (err) {
            responseDiv.innerHTML = '<div style="background:#f8d7da; color:#721c24; padding:14px; border-radius:6px; margin-top:14px; font-size:0.9rem;"><i class="fas fa-exclamation-circle"></i> Network error. Try WhatsApp instead.</div>';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    });
})();
</script>
